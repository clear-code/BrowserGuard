<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アクセスがブロックされました</title>
<style>
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    font-family: "Segoe UI", "Meiryo", sans-serif;
    color: #202124;
    background: #f8f9fa;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.25rem;
  }
  p {
    margin: 0 0 1rem;
    line-height: 1.7;
  }
  #url {
    display: block;
    padding: 0.75rem;
    background: #f1f3f4;
    border-radius: 4px;
    font-family: Consolas, monospace;
    font-size: 0.9rem;
    word-break: break-all;
  }
  #url:empty {
    display: none;
  }
  #back {
    margin-top: 1.5rem;
    padding: 0.5rem 1.5rem;
    font: inherit;
    color: #fff;
    background: #0f6cbd;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
  }
  #back:hover {
    background: #115ea3;
  }
  #back:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8eaed; background: #202124; }
    main { background: #292a2d; border-color: #5f6368; }
    #url { background: #35363a; }
    #back { background: #4cabff; color: #202124; }
    #back:hover { background: #6fbcff; }
  }
</style>
</head>
<body>
<main>
  <h1>アクセスがブロックされました</h1>
  <p>拡張機能のポリシーにより、このページは表示できません。</p>
  <span id="url"></span>
  <div><button id="back" type="button">前のページに戻る</button></div>
</main>
<!-- The extension page CSP forbids inline scripts, so this lives in a file. -->
<script src="blocked.js"></script>
</body>
</html>
